name: Frontend route integrity

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-route-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-route-integrity.yml"

jobs:
  route-and-sitemap-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and validate routes
        run: npm run test:routes
