name: FixWheel local validation

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-route-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-route-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-and-sitemap-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit --incremental false

      - name: Production build
        run: npm run build

      - name: Validate built routes and sitemap
        run: npm run test:routes:built

      - name: Audit rendered SEO metadata
        if: always()
        run: node scripts/ci-seo-report.cjs

      - name: Save SEO audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixwheel-seo-audit
          path: frontend/ci-seo-report.md
          if-no-files-found: ignore

  backend:
    name: Backend build and booking tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - name: Booking and backend unit tests
        run: node --test -r ts-node/register tests/*.test.ts
